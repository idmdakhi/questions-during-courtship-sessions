# MkDocs به‌صورت پیش‌فرض پوشه /templates/ را از سایت حذف می‌کند (و قابل جایگزینی نیست)؛
# قانون زیر آن را دوباره شامل می‌کند.
exclude_docs: |
  !/templates/
theme:
  name: material
  language: fa
  direction: rtl
  features:
    - navigation.top
    - search.suggest
    - content.code.copy
markdown_extensions:
  - tables
  - toc:
      permalink: true
validation:
  links:
    not_found: warn
    anchors: ignore
